name: Deploy the game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Export runtime files
        run: node tools/export-web.cjs web-release
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-release
      - name: Deploy the Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
