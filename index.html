<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0E0D12">
  <title>土楼争霸 · 漳州电竞+</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo_icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/net.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="intro" data-phase="entry">
      <canvas id="intro-canvas" aria-hidden="true"></canvas>
      <button id="intro-action" type="button"><span></span></button>
      <progress id="intro-progress" max="1" value="0" aria-label="正在加载游戏素材"></progress>
    </div>

    <!-- 战斗界面 HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <span class="chip" id="hud-level">古城街巷</span>
        <span class="chip"><i class="ico-fu">福</i><b id="hud-fu">0</b></span>
        <span class="chip">🏯 <b id="hud-hp">20</b></span>
        <span class="chip" id="hud-wave">第 0 / 5 波</span>
      </div>
      <div class="hud-right">
        <button class="sbtn" id="btn-next">下一波 ▶</button>
        <button class="sbtn" id="btn-speed">×1</button>
        <button class="sbtn" id="btn-sound">🔊</button>
        <button class="sbtn commentary-toggle" id="btn-commentary" type="button"></button>
        <button class="sbtn" id="btn-pause">⏸</button>
      </div>
    </div>

    <div id="commentary">
      <span class="comment-avatar" aria-hidden="true"><span id="commentary-icon"></span><img id="commentary-avatar" alt="" hidden></span>
      <span id="commentary-text" role="status"></span>
    </div>

    <!-- 底部：木偶商店 + 大招 -->
    <div id="dock" class="hidden">
      <div id="shop"></div>
      <button id="btn-ult" disabled>
        <span class="ult-name">五福临门</span>
        <span class="ult-bar"><span id="ult-fill"></span></span>
      </button>
    </div>
    <div id="tip"></div>

    <!-- 双人对决界面 -->
    <div id="vs-ui" class="hidden">
      <div id="vs-top">
        <div class="vs-hp L"><span class="vs-team">红方</span><span class="vs-bar"><span id="vs-hpL"></span></span><b id="vs-hpLt">30</b></div>
        <div class="vs-mid">
          <div id="vs-clock">3:00</div>
          <div class="vs-controls">
            <button class="sbtn" id="vs-pause">⏸</button>
            <button class="sbtn hidden" id="vs-net-exit" type="button" data-go="menu">退出对战</button>
            <button class="sbtn commentary-toggle" id="vs-commentary" type="button"></button>
          </div>
          <span id="vs-net-role" class="hidden"></span>
        </div>
        <div class="vs-hp R"><b id="vs-hpRt">30</b><span class="vs-bar"><span id="vs-hpR"></span></span><span class="vs-team">金方</span></div>
      </div>
      <div class="vs-panel L" id="vs-panelL"></div>
      <div class="vs-panel R" id="vs-panelR"></div>
    </div>

    <section id="screen-versus" class="screen hidden" aria-label="双人对决"></section>

    <!-- 双人对决结算 -->
    <div id="screen-vsresult" class="screen hidden dim">
      <div class="panel result">
        <h2 id="vs-result-title">红方获胜！</h2>
        <table id="vs-result-table"></table>
        <div class="menu-btns row">
          <button class="btn" id="btn-fortune-versus" type="button"></button>
          <button class="btn" id="vs-again">再来一局</button>
          <button class="btn ghost" data-go="menu">主菜单</button>
        </div>
      </div>
    </div>

    <!-- 主菜单 -->
    <div id="screen-menu" class="screen">
      <div id="menu-scene" class="menu-scene" hidden></div>
      <div class="title-wrap">
        <img id="logo-img" src="assets/images/logo.png" alt="" onerror="this.style.display='none';document.getElementById('logo-text').style.display='block'">
        <h1 id="logo-text">土楼争霸</h1>
        <p class="sub">漳州 · 电竞+ · 布袋木偶守土楼</p>
      </div>
      <div id="menu-text-buttons" class="menu-btns">
        <button class="btn" data-go="levels">开始游戏</button>
        <button class="btn" id="btn-versus">双人对决</button>
        <button class="btn ghost" data-go="help">玩法说明</button>
        <button class="btn ghost" id="btn-gallery" data-go="gallery"></button>
      </div>
    </div>

    <!-- 选关 -->
    <div id="screen-levels" class="screen hidden">
      <div id="level-list-fallback">
        <h2>选择关卡</h2>
        <div id="level-list"></div>
        <button class="btn ghost" data-go="menu">返回</button>
      </div>
      <div id="level-map" hidden>
        <div id="level-map-world">
          <div id="level-map-paper">
            <canvas id="level-map-route" aria-hidden="true"></canvas>
            <div id="level-map-nodes"></div>
            <canvas id="level-map-fx" aria-hidden="true"></canvas>
          </div>
          <span class="map-roller map-roller-left" aria-hidden="true"></span>
          <span class="map-roller map-roller-right" aria-hidden="true"></span>
        </div>
        <div class="map-veil" aria-hidden="true"></div>
        <header class="map-toolbar">
          <button type="button" class="map-back" data-go="menu"></button>
          <h2 id="map-title"></h2>
          <output id="map-total"></output>
        </header>
        <section id="map-info" aria-labelledby="map-info-title" hidden>
          <button id="map-info-close" type="button">×</button>
          <p id="map-info-stage"></p>
          <h3 id="map-info-title"></h3>
          <p id="map-info-story"></p>
          <dl id="map-info-stats"></dl>
          <button id="map-play" type="button"></button>
        </section>
      </div>
    </div>

    <!-- 玩法说明 -->
    <div id="screen-help" class="screen hidden">
      <div id="help-stage-art" class="culture-backdrop"></div>
      <div id="help-opening">
        <div id="help-page" role="tabpanel" tabindex="0"></div>
        <div class="help-curtain help-curtain-left" aria-hidden="true"></div>
        <div class="help-curtain help-curtain-right" aria-hidden="true"></div>
      </div>
      <header class="map-toolbar">
        <button type="button" class="map-back" data-go="menu"></button>
        <h2 id="help-title"></h2>
      </header>
      <footer class="help-rail">
        <div id="help-tabs" role="tablist" aria-labelledby="help-title"></div>
        <button type="button" id="help-try" data-go="levels"></button>
      </footer>
    </div>

    <!-- 藏宝阁 -->
    <div id="screen-gallery" class="screen hidden">
      <div id="gallery-backdrop" class="culture-backdrop"></div>
      <div id="gallery-lanterns" aria-hidden="true"></div>
      <header id="gallery-toolbar" class="map-toolbar">
        <button type="button" class="map-back" data-go="menu"></button>
        <h2 id="gallery-title"></h2>
        <div class="gallery-progress">
          <output id="gallery-count"></output>
          <progress id="gallery-progress" aria-labelledby="gallery-count"></progress>
        </div>
      </header>
      <div id="gallery-list"></div>
      <p id="gallery-award" hidden></p>
      <canvas id="gallery-fx" aria-hidden="true"></canvas>
      <div id="gallery-overlay" hidden>
        <section id="gallery-detail" role="dialog" aria-modal="true" aria-labelledby="gallery-detail-title">
          <button id="gallery-close" type="button">×</button>
          <div id="gallery-detail-art" role="img"></div>
          <div class="gallery-detail-copy">
            <h3 id="gallery-detail-title"></h3>
            <p id="gallery-detail-text"></p>
            <p id="gallery-detail-related"></p>
            <p id="gallery-detail-source"></p>
          </div>
          <footer class="gallery-detail-nav">
            <button id="gallery-prev" type="button"></button>
            <button id="gallery-speak" type="button" hidden></button>
            <button id="gallery-next" type="button"></button>
          </footer>
        </section>
      </div>
    </div>

    <!-- 知识卡弹窗 -->
    <div id="screen-card" class="screen hidden dim">
      <div class="card-pop">
        <div class="card-tag">解锁新知识卡</div>
        <div class="card-img" id="card-img"></div>
        <h3 id="card-title"></h3>
        <p id="card-text"></p>
        <button class="btn" id="btn-card-ok">收下这张卡</button>
      </div>
    </div>

    <!-- 结算 -->
    <div id="screen-result" class="screen hidden dim">
      <div class="panel result">
        <h2 id="result-title">胜利</h2>
        <p id="result-stats"></p>
        <div class="menu-btns row">
          <button class="btn" id="btn-fortune-single" type="button"></button>
          <button class="btn" id="btn-next-level">下一关</button>
          <button class="btn ghost" id="btn-retry">再来一次</button>
          <button class="btn ghost" id="btn-result-map" data-go="levels"></button>
          <button class="btn ghost" data-go="menu">主菜单</button>
        </div>
      </div>
    </div>

    <!-- 暂停 -->
    <div id="screen-pause" class="screen hidden dim">
      <div class="panel result">
        <h2>已暂停</h2>
        <div class="menu-btns row">
          <button class="btn" id="btn-resume">继续</button>
          <button class="btn ghost" id="btn-quit">退出关卡</button>
        </div>
      </div>
    </div>

    <dialog id="fortune-preview" class="fortune-preview" aria-labelledby="fortune-heading">
      <h2 id="fortune-heading"></h2>
      <img id="fortune-image" draggable="false" alt="">
      <canvas id="fortune-confetti" aria-hidden="true"></canvas>
      <div class="fortune-actions">
        <a id="fortune-download" class="btn"></a>
        <span id="fortune-touch-hint"></span>
        <button id="fortune-close" class="btn ghost" type="button" autofocus></button>
      </div>
    </dialog>
  </div>

  <div id="rotate-tip" role="status">请横过来玩 📱↻</div>

  <script src="js/mobile.js"></script>
  <script src="js/data.js"></script>
  <script src="js/juice.js"></script>
  <script src="js/game.js"></script>
  <script src="js/versus.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/net.js"></script>
  <script src="js/fortune.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/levelmap.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/help.js"></script>
  <script src="js/intro.js" onerror="document.getElementById('intro').hidden = true; window.NET?.autoJoin()"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
